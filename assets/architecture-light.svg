<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">Orion architecture</title><desc id="d">Servers and apps send reports and logs to Orion Core. Core, its monitor worker and SQLite run on one host. The Console reads from Core, and alerts leave by webhook or email.</desc><style>.pl{font:500 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;fill:#71717a}.t{font:500 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#18181b}.s{font:400 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#71717a}.dt{font:500 18px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#fff}.ds{font:400 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#9fc4b3}.fl{font:400 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#71717a}.fw{animation:fw 1s linear infinite}.bk{animation:bk 1.6s ease-in-out infinite}@keyframes fw{to{stroke-dashoffset:-24}}@keyframes bk{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.fw,.bk{animation:none}}</style><rect x="32" y="36" width="296" height="316" rx="18" fill="#f7f7f6" stroke="#ececea"/><text x="54" y="68" class="pl">Your servers</text><rect x="56" y="88" width="248" height="92" rx="12" fill="#18181b" opacity="0.06"/><rect x="56" y="86" width="248" height="92" rx="12" fill="#ffffff" stroke="#e4e4e7"/><circle cx="78" cy="123.0" r="4.5" fill="#2a9f69"/><text x="96" y="128.0" class="t">Orion Server</text><text x="96" y="149.0" class="s">Linux or macOS · orion-agent</text><rect x="56" y="202" width="248" height="92" rx="12" fill="#18181b" opacity="0.06"/><rect x="56" y="200" width="248" height="92" rx="12" fill="#ffffff" stroke="#e4e4e7"/><circle cx="78" cy="237.0" r="4.5" fill="#2a9f69"/><text x="96" y="242.0" class="t">Orion Server</text><text x="96" y="263.0" class="s">Linux or macOS · orion-agent</text><text x="180" y="326" class="s" text-anchor="middle">…one per host you watch</text><rect x="32" y="384" width="296" height="148" rx="18" fill="#f7f7f6" stroke="#ececea"/><text x="54" y="416" class="pl">Your apps</text><rect x="56" y="430" width="248" height="80" rx="12" fill="#18181b" opacity="0.06"/><rect x="56" y="428" width="248" height="80" rx="12" fill="#ffffff" stroke="#e4e4e7"/><circle cx="78" cy="459.0" r="4.5" fill="#2a9f69"/><text x="96" y="464.0" class="t">Any service</text><text x="96" y="485.0" class="s">JSON or OpenTelemetry logs</text><rect x="400" y="36" width="556" height="496" rx="18" fill="#f7f7f6" stroke="#ececea"/><text x="422" y="68" class="pl">Core host · Docker Compose</text><rect x="520" y="95" width="316" height="104" rx="14" fill="#000" opacity=".25"/><rect x="520" y="92" width="316" height="104" rx="14" fill="#142a23" stroke="#2d5446"/><circle cx="544" cy="122" r="4.5" fill="#6ee7b7" class="bk"/><text x="564" y="127" class="dt">Orion Core</text><text x="544" y="174" class="ds">API · serves the Console</text><rect x="716" y="323" width="200" height="104" rx="14" fill="#000" opacity=".25"/><rect x="716" y="320" width="200" height="104" rx="14" fill="#142a23" stroke="#2d5446"/><circle cx="740" cy="350" r="4.5" fill="#6ee7b7" class="bk"/><text x="760" y="355" class="dt">Monitor worker</text><text x="740" y="402" class="ds">runs Core checks</text><ellipse cx="540" cy="437" rx="84" ry="16" fill="#000" opacity=".25"/><path d="M456 340 V430 C456 446 494 456 540 456 C586 456 624 446 624 430 V340Z" fill="#142a23" stroke="#2d5446"/><ellipse cx="540" cy="340" rx="84" ry="16" fill="#1c3a30" stroke="#2d5446"/><path d="M456 388 C456 404 494 414 540 414 C586 414 624 404 624 388" fill="none" stroke="#2d5446"/><text x="540" y="436" class="dt" text-anchor="middle" style="font-size:17px">SQLite</text><text x="540" y="472" class="ds" text-anchor="middle" style="fill:#71717a">one file · /data</text><rect x="988" y="36" width="180" height="496" rx="18" fill="#f7f7f6" stroke="#ececea"/><text 