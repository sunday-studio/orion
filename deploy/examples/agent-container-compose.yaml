# Orion Agent as a container. Create a one-time token in the Console (Servers, Add server) and run:
#   ORION_CORE_URL=https://orion.example.com ORION_ENROLLMENT_TOKEN=<token> docker compose -f agent-container-compose.yaml up -d
# See docs/deployment/agent-container.md for what this can and cannot see.
services:
  orion-agent:
    image: ${ORION_AGENT_IMAGE:-ghcr.io/sunday-studio/orion-agent:latest}
    container_name: orion-agent
    restart: unless-stopped
    hostname: ${ORION_AGENT_HOSTNAME:-my-server}   # the name this server gets in the Console
    pid: host                                      # see the host's processes, not just this container
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ORION_CORE_URL: ${ORION_CORE_URL:?set ORION_CORE_URL}
      ORION_ENROLLMENT_TOKEN: ${ORION_ENROLLMENT_TOKEN:-}   # only needed for the first start
    volumes:
      - orion-agent-data:/var/lib/orion
      # Optional: per-container metrics. The Docker socket is root-equivalent on the host.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # group_add: ["<gid of the docker group>"]   # needed with the socket above

volumes:
  orion-agent-data:
