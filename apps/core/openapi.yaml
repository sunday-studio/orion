        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Get public status page component uptime
      tags:
      - public-status
  /status/{slug}/history:
    get:
      consumes:
      - application/json
      description: Get sanitized public history for a published or unlisted status
        page
      operationId: getPublicStatusPageHistory
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      - default: 90d
        description: 'Uptime window: 24h, 7d, 30d, or 90d'
        in: query
