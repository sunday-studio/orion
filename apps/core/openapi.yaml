                  properties:
                    count:
                      type: integer
                    events:
                      items:
                        $ref: '#/definitions/internal_api.OrionEventResponse'
                      type: array
                    has_more:
                      type: boolean
                    limit:
                      type: integer
                    next_cursor:
                      type: string
