        type: string
      timestamp:
        type: string
      trace_id:
        type: string
    type: object
  internal_api.LogEntryInput:
    properties:
      attributes:
        additionalProperties: true
        description: 'Attributes is free-form JSON of any shape. Limits: depth 8,
          128 keys per entry.'
        type: object
      body:
        description: 'Body is the human message: a string, or any JSON value (kept
          as structured data and searchable as text).'
        example: payment failed for order 8841
        type: string
      event:
        description: Event is a short stable name for product events, for example
          payment.failed.
        example: payment.failed
        type: string
      id:
        description: ID is an optional client-chosen idempotency key (unique per app).
          Re-sending the same id is a no-op.
        example: 01JBXK3Q8Z
        type: string
      request_id:
        description: RequestID correlates entries of one request or job.
        example: req_7f3a
        type: string
      resource:
        additionalProperties: true
        description: 'Resource describes the emitter: service.name, service.version,
          deployment.environment, host.name, ...'
        type: object
      severity:
        description: Severity is trace|debug|info|warn|error|fatal, an OpenTelemetry
          number (1-24), or a common alias. Unknown values become info.
        example: error
        type: string
      span_id:
        example: 00f067aa0ba902b7
        type: string
      timestamp:
        description: Timestamp is RFC 3339 text, or a number of Unix seconds, milliseconds
          or nanoseconds. Defaults to the receive time.
        example: "2026-10-17T10:15:30.123Z"
        type: string
      trace_id:
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
