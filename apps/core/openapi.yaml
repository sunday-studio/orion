          match inside the window) or "absence" (fires when none match, for example
          a job that must log every hour).
        enum:
        - threshold
        - absence
        type: string
      name:
        example: Checkout errors spike
        type: string
      q:
        type: string
      severity:
        description: 'Severity, Event and Q filter which entries count (same syntax
          as the log search: severity=">=error", an exact event name, a text substring).'
        example: '>=error'
        type: string
      state:
        description: State is "firing" while an incident is open for the rule, otherwise
          "ok".
        enum:
        - ok
        - firing
        type: string
      threshold:
        example: 20
        type: integer
      window_seconds:
        example: 300
        type: integer
    type: object
