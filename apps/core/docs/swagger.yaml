          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Accept detected suggestions
      tags:
      - nodes
  /v1/nodes/{node_id}/discovery/requests:
    post:
      consumes:
      - application/json
      description: 'The Console never changes the host. A request is queued here and
        the node applies it at its next check-in (about every minute), then reports
        the outcome. Types: rescan, dismiss, restore, ignore, unignore (payload.ids),
        set_scanning (payload.enabled), set_kind (payload.kind, payload.enabled),
        track_storage (payload.paths). A node that has not said it can take requests
        gets the request stored as unsupported. Requests expire after 24 hours.'
      operationId: createNodeDiscoveryRequest
      parameters:
      - description: Node ID
        in: path
        name: node_id
        required: true
        type: string
