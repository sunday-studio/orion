          type: array
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_api.IngestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      security:
      - IngestKey: []
      summary: Ingest logs
      tags:
      - ingest
  /v1/ingest/otlp/v1/logs:
    post:
      consumes:
      - application/json
      description: OpenTelemetry Logs endpoint (ExportLogsServiceRequest) as JSON
        (application/json) or protobuf (application/x-protobuf), so any OpenTelemetry
        SDK or Collector can send logs with no Orion-specific code. Authenticate with
        an app ingest key. Responds per the OTLP spec with an ExportLogsServiceResponse
        (partial_success when some records were rejected).
      operationId: ingestOTLPLogs
      parameters:
      - description: ExportLogsServiceRequest (OTLP/HTTP JSON; protobuf is also accepted)
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "429":
