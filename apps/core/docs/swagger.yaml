        and admin actions, newest first, with the total for the filter. Page with
        cursor (older) or cursor plus direction=newer. The default window is the last
        24 hours and no query may span more than 30 days (400 otherwise). Relative
        times accept -15m, -24h and -7d.
      operationId: listStatusLogs
      parameters:
      - description: 'Comma-separated: info, warn, error'
        in: query
        name: level
        type: string
      - description: 'Comma-separated: monitor, alert, server, incident, system'
        in: query
        name: type
        type: string
      - description: Only this server
        in: query
        name: server_id
        type: string
      - description: Only this monitor
        in: query
        name: monitor_id
        type: string
      - description: Only this incident
        in: query
        name: incident_id
        type: string
      - description: Search servers, monitors, titles and details
        in: query
        name: q
        type: string
      - description: Start (RFC 3339, or relative like -1h); default 24 hours ago
        in: query
        name: from
        type: string
      - description: End (RFC 3339); default now
        in: query
        name: to
        type: string
      - default: 100
        description: Rows per page, max 200
        in: query
        name: limit
        type: integer
      - description: Cursor from a previous page
        in: query
        name: cursor
        type: string
      - description: older (default) or newer
        enum:
        - older
        - newer
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
