basePath: /
definitions:
  internal_api.APIToken:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        example: ci-deploys
        type: string
      prefix:
        example: orn_api_3Fk9
        type: string
      scope:
        enum:
        - read
        - write
        type: string
    type: object
  internal_api.APITokenCreated:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        example: ci-deploys
        type: string
      prefix:
        example: orn_api_3Fk9
        type: string
      scope:
        enum:
        - read
        - write
        type: string
      token:
        example: orn_api_3Fk9d2a7c1e5b8046a9d3f2e1c7b5a40
        type: string
    type: object
  internal_api.APITokenRequest:
    properties:
      name:
        type: string
      scope:
        description: Scope is read (GET requests only) or write (everything except
          token management).
        enum:
        - read
        - write
        type: string
    required:
    - name
    type: object
  internal_api.AcceptDiscoveredRequest:
    properties:
      fail_after:
        description: FailAfter is how many failed checks in a row raise an alert (1
          to 20). Default 2.
        type: integer
      interval_seconds:
        description: IntervalSeconds is how often each new monitor runs (10 to 86400).
          Default 30.
        type: integer
      item_ids:
        items:
          type: string
        type: array
    required:
    - item_ids
    type: object
  internal_api.AlertChannelDetailResponse:
    properties:
      alert:
        description: 'Alert is set while the channel is failing: the banner text.'
        type: string
      channel:
        $ref: '#/definitions/internal_api.AlertChannelResponse'
      consecutive_failures:
        type: integer
      payload_preview:
        allOf:
        - $ref: '#/definitions/orion_core_internal_service.AlertPayload'
        description: PayloadPreview is a sample of what a webhook receives.
      recent_deliveries:
        items:
          $ref: '#/definitions/internal_api.AlertDeliveryResponse'
        type: array
      recent_total:
        type: integer
      rules_using:
        items:
          $ref: '#/definitions/internal_api.AlertRuleRef'
        type: array
    type: object
  internal_api.AlertChannelResponse:
    properties:
      confirmed_recipient_count:
        type: integer
      consecutive_failures:
        type: integer
      created_at:
        type: string
      email_delivery_mode:
        type: string
      email_subject_prefix:
        type: string
      enabled:
        type: boolean
      header_names:
        items:
          type: string
        type: array
      health:
        description: 'Health: failing (the newest delivery failed), healthy (it succeeded)
          or untested (never delivered).'
        enum:
        - failing
        - healthy
        - untested
        type: string
      id:
        type: string
      last_delivery_at:
        type: string
      last_delivery_status:
        type: string
      last_delivery_text:
        description: LastDeliveryText reads "3 failed, 502", "Sent" or "Never".
        type: string
      name:
        type: string
      recipient_count:
        type: integer
      signing_secret_mask:
        type: string
      subscribed_events:
        items:
          type: string
        type: array
      type:
        type: string
      updated_at:
        type: string
      webhook_configured:
        type: boolean
      webhook_signature_configured:
        type: boolean
      webhook_url:
        type: string
    type: object
  internal_api.AlertChannelSummary:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  internal_api.AlertDeliveryAttemptResponse:
    properties:
      alert_delivery_id:
        type: string
      attempt_number:
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      duration_ms:
        type: integer
      error:
        type: string
      http_status:
        type: integer
      id:
        type: string
      result_text:
        description: ResultText reads "502 Bad Gateway" or "Timeout"; HTTPStatus is
          0 when no response arrived.
        type: string
      stage:
        type: string
      started_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  internal_api.AlertDeliveryDetailResponse:
    properties:
      channel:
        $ref: '#/definitions/internal_api.AlertChannelSummary'
      delivery:
        $ref: '#/definitions/internal_api.AlertDeliveryResponse'
      payload:
        $ref: '#/definitions/orion_core_internal_service.AlertPayload'
      retry_note:
        description: 'RetryNote repeats the screen''s promise: a retry resends the
          same payload and creates no new record.'
        type: string
      retryable:
        type: boolean
    type: object
  internal_api.AlertDeliveryResponse:
    properties:
      alert_group_id:
        type: string
      alert_title:
        description: |-
          Filled on list and detail: the alert's title ("Critical down", the rule name), the incident's INC id,
          the channel id, and the newest result ("502", "Timeout", "Sent") with how long the last attempt took.
        type: string
      attempt_count:
        type: integer
      attempts:
        items:
          $ref: '#/definitions/internal_api.AlertDeliveryAttemptResponse'
        type: array
      channel:
        type: string
      channel_id:
        type: string
      created_at:
        type: string
      duration_ms:
        type: integer
      error:
        type: string
      event_type:
        type: string
      id:
        type: string
      incident_display_id:
        type: string
      incident_id:
        type: string
      last_attempt_at:
        type: string
      max_attempts:
        type: integer
      next_attempt_at:
        type: string
      result_text:
        type: string
      route_id:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  internal_api.AlertRecipientResponse:
    properties:
      confirmed_at:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        description: pending | confirmed | unsubscribed
        type: string
    type: object
  internal_api.AlertRouteDryRunResponse:
    properties:
      destination_decisions:
        items:
          $ref: '#/definitions/orion_core_internal_service.AlertDestinationDecision'
        type: array
      event:
        $ref: '#/definitions/orion_core_internal_service.AlertRouteContext'
      legacy_fallback:
        type: boolean
      route_evaluations:
        items:
          $ref: '#/definitions/internal_api.AlertRouteEvaluationResponse'
        type: array
      suppressed:
        type: boolean
      suppression_reason:
        type: string
    type: object
  internal_api.AlertRouteEvaluationResponse:
    properties:
      matched:
        type: boolean
      reasons:
        items:
          type: string
        type: array
      route:
        $ref: '#/definitions/internal_api.AlertRouteResponse'
      suppressed:
        type: boolean
    type: object
  internal_api.AlertRouteResponse:
    properties:
      channel_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      enabled:
        type: boolean
      event_types:
        items:
          type: string
        type: array
      grouping_delay_seconds:
        type: integer
      grouping_policy:
        type: string
      id:
        type: string
      monitor_ids:
        items:
          type: string
        type: array
      monitor_types:
        items:
          type: string
        type: array
      name:
        type: string
      node_ids:
        items:
          type: string
        type: array
      priority:
        type: integer
      severities:
        items:
          type: string
        type: array
      suppress:
        type: boolean
      updated_at:
        type: string
    type: object
  internal_api.AlertRuleDestinationDecision:
    properties:
      channel_id:
        type: string
      channel_name:
        type: string
      channel_type:
        type: string
      reason:
        type: string
      rule_id:
        type: string
      rule_name:
        type: string
      status:
        type: string
    type: object
  internal_api.AlertRuleDryRunContext:
    properties:
      event_type:
        type: string
      incident_id:
        type: string
      monitor_id:
        type: string
      monitor_type:
        type: string
      node_id:
        type: string
      severity:
        type: string
    type: object
  internal_api.AlertRuleDryRunResponse:
    properties:
      destination_decisions:
        items:
          $ref: '#/definitions/internal_api.AlertRuleDestinationDecision'
        type: array
      event:
        $ref: '#/definitions/internal_api.AlertRuleDryRunContext'
      legacy_fallback:
        type: boolean
      rule_evaluations:
        items:
          $ref: '#/definitions/internal_api.AlertRuleEvaluationResponse'
        type: array
      suppressed:
        type: boolean
      suppression_reason:
        type: string
    type: object
  internal_api.AlertRuleEvaluationResponse:
    properties:
      matched:
        type: boolean
      reasons:
        items:
          type: string
        type: array
      rule:
        $ref: '#/definitions/internal_api.AlertRuleResponse'
      suppressed:
        type: boolean
    type: object
  internal_api.AlertRuleRef:
    properties:
      id:
        type: string
      name:
        type: string
      summary:
        type: string
    type: object
  internal_api.AlertRuleResponse:
    properties:
      channel_ids:
        items:
          type: string
        type: array
      cooldown_seconds:
        type: integer
      created_at:
        type: string
      enabled:
        type: boolean
      event_types:
        items:
          type: string
        type: array
      grouping_delay_seconds:
        type: integer
      grouping_policy:
        type: string
      how_it_runs:
        $ref: '#/definitions/internal_api.RuleHowItRuns'
      id:
        type: string
      last_24h_fired:
        type: integer
      monitor_ids:
        items:
          type: string
        type: array
      monitor_types:
        items:
          type: string
        type: array
      name:
        type: string
      node_ids:
        items:
          type: string
        type: array
      priority:
        type: integer
      severities:
        items:
          type: string
        type: array
      summary:
        description: Summary is the sentence in the Rules list; Last24hFired counts
          distinct incident notifications in the last day.
        type: string
      suppress:
        type: boolean
      updated_at:
        type: string
    type: object
  internal_api.AlertTestResult:
    properties:
      actual:
        $ref: '#/definitions/internal_api.IncidentExpectation'
      body:
        type: string
      duration_ms:
        type: integer
      expected:
        $ref: '#/definitions/internal_api.IncidentExpectation'
      hint:
        type: string
      passed:
        type: boolean
      recipients:
        description: 'Recipients is set for email channels: confirmed addresses mailed
          vs addresses skipped as unconfirmed.'
        properties:
          delivered:
            type: integer
          skipped:
            type: integer
        type: object
      status:
        enum:
        - passed
        - failed
        type: string
      status_code:
        type: integer
    type: object
  internal_api.App:
    properties:
      created_at:
        type: string
      debug_sample_rate:
        description: DebugSampleRate keeps this fraction (0-1) of trace and debug
          entries. Default 1.
        example: 1
        type: number
      description:
        type: string
      display_profile:
        $ref: '#/definitions/internal_api.DisplayProfile'
      environment:
        example: production
        type: string
      id:
        type: string
      key_count:
        type: integer
      last_ingest_at:
        type: string
      lines:
        type: integer
      max_storage_mb:
        description: MaxStorageMB caps stored log size for this app; the oldest entries
          are pruned first. 0 means the server default.
        type: integer
      name:
        example: checkout-api
        type: string
      rate_limit_per_second:
        description: RateLimitPerSecond is this app's ingest limit in lines per second;
          0 uses the server default.
        type: integer
      rate_per_second:
        description: RatePerSecond is the average over the last minute.
        type: number
      redaction:
        $ref: '#/definitions/internal_api.RedactionSettings'
      retention_days:
        description: RetentionDays defaults to 14.
        example: 14
        type: integer
      slug:
        example: checkout-api
        type: string
      status:
        description: Status is receiving (a log in the last 5 minutes), quiet or never.
        enum:
        - receiving
        - quiet
        - never
        type: string
      storage_bytes:
        description: StorageBytes is what the app currently uses; StorageCapBytes
          its size cap (0 = no cap).
        type: integer
      storage_cap_bytes:
        type: integer
      storage_percent:
        type: integer
    type: object
  internal_api.AppRequest:
    properties:
      debug_sample_rate:
        type: number
      description:
        type: string
      display_profile:
        $ref: '#/definitions/internal_api.DisplayProfile'
      environment:
        type: string
      max_storage_mb:
        type: integer
      name:
        type: string
      rate_limit_per_second:
        type: integer
      redaction:
        $ref: '#/definitions/internal_api.RedactionSettings'
      retention_days:
        type: integer
    required:
    - name
    type: object
  internal_api.AppUpdateRequest:
    properties:
      debug_sample_rate:
        type: number
      description:
        type: string
      display_profile:
        $ref: '#/definitions/internal_api.DisplayProfile'
      environment:
        type: string
      max_storage_mb:
        type: integer
      name:
        type: string
      rate_limit_per_second:
        type: integer
      redaction:
        $ref: '#/definitions/internal_api.RedactionSettings'
      retention_days:
        type: integer
    type: object
  internal_api.AuditActor:
    properties:
      actor:
        type: string
      count:
        type: integer
    type: object
  internal_api.AuditEntry:
    properties:
      action:
        description: Action is the phrase shown in the log, for example "Resolved
          incident".
        type: string
      action_key:
        example: incident_resolved
        type: string
      actor:
        example: admin
        type: string
      actor_type:
        description: ActorType is user, api_token or system.
        enum:
        - user
        - api_token
        - system
        type: string
      at:
        type: string
      id:
        type: string
      object_id:
        type: string
      object_type:
        type: string
      target:
        description: Target names what was changed, for example "INC-0231" or "api-https".
        type: string
    type: object
  internal_api.AuditListResponse:
    properties:
      actors:
        description: Actors lists who appears in the log, for the Actor filter.
        items:
          $ref: '#/definitions/internal_api.AuditActor'
        type: array
      entries:
        items:
          $ref: '#/definitions/internal_api.AuditEntry'
        type: array
      next_cursor:
        type: string
    type: object
  internal_api.AvailabilityPeriod:
    properties:
      availability_percent:
        type: number
      downtime_seconds:
        type: integer
      incidents:
        type: integer
      longest_ongoing:
        description: LongestOngoing is true when the longest incident has not ended.
        type: boolean
      longest_seconds:
        type: integer
      period:
        enum:
        - today
        - 7d
        - 30d
        - 365d
        type: string
    type: object
  internal_api.BulkIncidentRequest:
    properties:
      action:
        enum:
        - acknowledge
        - cover
        - resolve
        type: string
      covered_by:
        description: CoveredBy applies to the cover action.
        type: string
      ids:
        items:
          type: string
        type: array
      note:
        type: string
    required:
    - action
    - ids
    type: object
  internal_api.BulkIncidentResult:
    properties:
      error:
        type: string
      id:
        type: string
      incident:
        $ref: '#/definitions/internal_api.IncidentResponse'
      ok:
        type: boolean
    type: object
  internal_api.BulkMonitorRequest:
    properties:
      action:
        enum:
        - pause
        - resume
        - maintenance
        - delete
        - clone
        type: string
      ids:
        items:
          type: string
        type: array
      keep_history:
        description: KeepHistory applies to delete (default true).
        type: boolean
      maintenance:
        allOf:
        - $ref: '#/definitions/internal_api.MonitorMaintenanceRequest'
        description: Maintenance applies to the maintenance action.
    required:
    - action
    - ids
    type: object
  internal_api.BulkMonitorResult:
    properties:
      error:
        type: string
      id:
        type: string
      new_id:
        description: NewID is the clone's id for the clone action.
        type: string
      ok:
        type: boolean
    type: object
  internal_api.BulkUpdateNodeMonitorDefinitionsRequest:
    properties:
      fail_after:
        description: FailAfter is how many failed checks in a row raise an alert (1
          to 20).
        type: integer
      ids:
        items:
          type: string
        type: array
      interval_seconds:
        description: IntervalSeconds is how often the check runs (10 to 86400).
        type: integer
    required:
    - ids
    type: object
  internal_api.CoreMonitorConfigResponse:
    properties:
      config:
        additionalProperties: {}
        type: object
      confirmation_check_count:
        type: integer
      confirmation_period_seconds:
        type: integer
      heartbeat_token:
        type: string
      interval_seconds:
        type: integer
      kind:
        type: string
      last_failure_at:
        type: string
      last_run_at:
        type: string
      last_signal_at:
        type: string
      last_success_at:
        type: string
      lease_expires_at:
        type: string
      lease_owner:
        type: string
      monitor_id:
        type: string
      next_run_at:
        type: string
      paused:
        type: boolean
      recovery_period_seconds:
        type: integer
      secret_refs:
        additionalProperties: {}
        type: object
      timeout_seconds:
        type: integer
    type: object
  internal_api.CoreMonitorManagementResponse:
    properties:
      config:
        $ref: '#/definitions/internal_api.CoreMonitorConfigResponse'
      monitor:
        $ref: '#/definitions/internal_api.MonitorResponse'
      result:
        $ref: '#/definitions/internal_api.CoreMonitorTestNowResponse'
    type: object
  internal_api.CoreMonitorTestNowResponse:
    properties:
      monitor_id:
        type: string
      status:
        type: string
    type: object
  internal_api.DataLifecycleRollupRequest:
    properties:
      date:
        example: "2026-05-12"
        type: string
    type: object
  internal_api.DeclareIncidentRequest:
    properties:
      monitor_id:
        type: string
      node_id:
        type: string
      notify:
        description: Notify queues alerts through the channels the matching rules
          select.
        type: boolean
      severity:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      summary:
        type: string
      title:
        type: string
    required:
    - severity
    - title
    type: object
  internal_api.DefinitionResultsRequest:
    properties:
      results:
        items:
          $ref: '#/definitions/orion_core_internal_service.DefinitionResult'
        type: array
    required:
    - results
    type: object
  internal_api.DiscoveryRequestResult:
    properties:
      result:
        description: Result is the node's own words (a reason when it failed), shown
          verbatim in the Console.
        type: string
      status:
        enum:
        - applied
        - failed
        - unsupported
        type: string
    required:
    - status
    type: object
  internal_api.DisplayProfile:
    properties:
      columns:
        description: Columns are attribute keys shown as extra columns in the list.
        items:
          type: string
        type: array
      hidden:
        description: Hidden are attribute keys removed from the detail view (they
          are still stored).
        items:
          type: string
        type: array
      title_field:
        description: TitleField is the attribute shown as the row title instead of
          the body.
        example: event
        type: string
    type: object
  internal_api.EnrollmentCreatedResponse:
    properties:
      claimed_at:
        type: string
      core_url:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      first_report_at:
        type: string
      id:
        type: string
      install_command:
        type: string
      node_arch:
        type: string
      node_id:
        type: string
      node_name:
        type: string
      node_os:
        type: string
      node_version:
        type: string
      platform:
        type: string
      status:
        description: 'Status: waiting (nothing seen) | claimed (token accepted, registering)
          | registered | reporting (first report received) | expired | cancelled.'
        enum:
        - waiting
        - claimed
        - registered
        - reporting
        - expired
        - cancelled
        type: string
      token:
        example: orn_enr_0a1b2c3d4e5f
        type: string
    type: object
  internal_api.EnrollmentRequest:
    properties:
      platform:
        description: Platform is the tile picked in the wizard; it only shapes the
          install command.
        enum:
        - linux
        - macos
        - docker
        type: string
    type: object
  internal_api.EnrollmentResponse:
    properties:
      claimed_at:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      first_report_at:
        type: string
      id:
        type: string
      node_arch:
        type: string
      node_id:
        type: string
      node_name:
        type: string
      node_os:
        type: string
      node_version:
        type: string
      platform:
        type: string
      status:
        description: 'Status: waiting (nothing seen) | claimed (token accepted, registering)
          | registered | reporting (first report received) | expired | cancelled.'
        enum:
        - waiting
        - claimed
        - registered
        - reporting
        - expired
        - cancelled
        type: string
    type: object
  internal_api.ExportRequest:
    properties:
      format:
        description: Format is csv (default) or jsonl.
        enum:
        - csv
        - jsonl
        type: string
      include_raw:
        description: IncludeRaw adds the raw event as a column (CSV); JSON lines always
          contain the full event.
        type: boolean
      kind:
        description: Kind is logs (default), status, internal or audit.
        enum:
        - logs
        - status
        - internal
        - audit
        type: string
      query:
        description: Query is the screen's filter as a URL query string, for example
          "severity=error&from=-24h".
        example: severity=error&from=-24h
        type: string
    type: object
  internal_api.ExportResponse:
    properties:
      bytes:
        type: integer
      created_at:
        type: string
      download_url:
        type: string
      error:
        type: string
      expires_at:
        type: string
      finished_at:
        type: string
      format:
        type: string
      id:
        type: string
      kind:
        type: string
      rows:
        type: integer
      status:
        description: Status is queued, running, done or failed.
        enum:
        - queued
        - running
        - done
        - failed
        type: string
      truncated:
        type: boolean
    type: object
  internal_api.GeneralSettings:
    properties:
      instance_name:
        example: Acme Orion
        type: string
      public_url:
        example: https://orion.acme.test
        type: string
      public_url_source:
        description: PublicURLSource is settings, environment or empty.
        enum:
        - settings
        - environment
        type: string
      time_format:
        enum:
        - "12"
        - "24"
        type: string
      timezone:
        example: UTC
        type: string
      updated_at:
        type: string
    type: object
  internal_api.GeneralSettingsRequest:
    properties:
      instance_name:
        type: string
      public_url:
        type: string
      time_format:
        type: string
      timezone:
        type: string
    type: object
  internal_api.HealthIssue:
    properties:
      detail:
        example: timeout after 10s
        type: string
      health:
