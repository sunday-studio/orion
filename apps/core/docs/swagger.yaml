        in: query
        name: actor
        type: string
      - description: Filter incidents by covered lifecycle state
        in: query
        name: covered
        type: boolean
      - description: Filter incidents by notification status
        in: query
        name: notification_status
        type: string
      - description: Filter to incidents with failed notifications or high/critical/error
