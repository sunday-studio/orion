          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      security:
      - IngestKey: []
      summary: Ingest logs over OTLP/HTTP
      tags:
      - ingest
  /v1/internal-logs:
    get:
      description: Core's own log lines (API, worker, scheduler, node gateway), newest
        first with a cursor. Same filters and shape as GET /v1/logs; the component
        of each line is attributes.component. Routine successful HTTP requests are
        not recorded; failed and slow ones are.
      operationId: searchInternalLogs
      parameters:
      - description: Comma-separated severities, or a minimum with >=warn
        in: query
        name: severity
        type: string
      - description: Full-text search
        in: query
        name: q
        type: string
      - description: Start (RFC 3339, or relative like -1h)
        in: query
        name: from
        type: string
      - description: End (RFC 3339); default now
        in: query
        name: to
        type: string
      - description: Attribute filter key:value, repeatable (attr=component:worker)
        in: query
        name: attr
        type: string
      - default: 50
        description: Page size, max 200
        in: query
        name: limit
        type: integer
      - description: Cursor from a previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_api.LogListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "504":
          description: Gateway Timeout
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_api.SearchTimeoutBody'
              type: object
      security:
      - BearerAuth: []
      summary: Search internal logs
      tags:
      - internal-logs
