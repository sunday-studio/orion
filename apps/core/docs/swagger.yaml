        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    events:
                      items:
                        $ref: '#/definitions/internal_api.OrionEventResponse'
                      type: array
                    has_more:
                      type: boolean
                    limit:
                      type: integer
                    next_cursor:
                      type: string
                    offset:
                      type: integer
                    pagination:
                      $ref: '#/definitions/orion_core_internal_utils.PaginationMeta'
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
