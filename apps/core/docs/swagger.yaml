          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      security:
      - BearerAuth: []
