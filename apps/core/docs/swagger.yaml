  /v1/nodes/{node_id}/discovery:
    post:
      consumes:
      - application/json
      description: Node-to-Core. The node scans its host read-only for services, containers,
        ports, disks and log files that could be monitored and reports the result
        after each scan. The latest report replaces the previous one. Core only stores
        and shows it; nothing is monitored until a person accepts a suggestion.
      operationId: receiveNodeDiscovery
      parameters:
      - description: Node ID
        in: path
        name: node_id
        required: true
        type: string
      - description: Latest scan
        in: body
        name: data
        required: true
