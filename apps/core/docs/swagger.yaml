host: localhost:8999
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Orion Core API for server management and monitoring
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Orion Core API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Returns the health status of the API server
      operationId: getHealth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              service:
                type: string
              status:
                type: string
            type: object
      summary: Health check
      tags:
      - health
  /status/{slug}:
    get:
      consumes:
      - application/json
      description: Get the public-safe projection of a published or unlisted status
        page
      operationId: getPublicStatusPage
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    status_page:
                      $ref: '#/definitions/internal_api.StatusPagePreviewResponse'
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Get public status page
      tags:
      - public-status
  /status/{slug}/badge.json:
    get:
      description: 'Shields.io endpoint format: schemaVersion, label, message, color.'
      operationId: getPublicStatusPageBadgeJSON
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get public status page badge as JSON
      tags:
      - public-status
  /status/{slug}/badge.svg:
    get:
      description: Get an embeddable SVG badge for the current public-safe status
        page state
      operationId: getPublicStatusPageBadge
      parameters:
