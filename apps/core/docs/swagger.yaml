  /v1/ingest/logs:
    post:
      consumes:
      - application/json
      description: 'Send one entry, a JSON array of entries, or newline-delimited
        JSON (Content-Type application/x-ndjson). Authenticate with an app ingest
        key. Entries are validated individually: invalid ones are rejected without
        failing the batch. Limits: 64 KiB per entry, 10,000 entries and 1 MiB per
        request (5 MiB for NDJSON). Responds 202 once queued; 429 with Retry-After
        when the app is rate limited or the queue is full.'
      operationId: ingestLogs
      parameters:
      - description: One entry object, an array of entries, or NDJSON
        in: body
        name: entries
