host: localhost:8999
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Orion Core API for server management and monitoring
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Orion Core API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Returns the health status of the API server
      operationId: getHealth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              service:
                type: string
              status:
                type: string
            type: object
      summary: Health check
      tags:
      - health
  /status/{slug}:
    get:
      consumes:
      - application/json
      description: Get the public-safe projection of a published or unlisted status
        page
      operationId: getPublicStatusPage
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    status_page:
                      $ref: '#/definitions/internal_api.StatusPagePreviewResponse'
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Get public status page
      tags:
      - public-status
  /status/{slug}/badge.svg:
    get:
      description: Get an embeddable SVG badge for the current public-safe status
        page state
      operationId: getPublicStatusPageBadge
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - image/svg+xml
      responses:
        "200":
          description: SVG badge
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Get public status page badge
      tags:
      - public-status
  /status/{slug}/components/{component_id}/badge.svg:
    get:
      description: Get an embeddable SVG badge for a visible public component state
      operationId: getPublicStatusPageComponentBadge
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      - description: Public component ID
        in: path
        name: component_id
        required: true
        type: string
      produces:
      - image/svg+xml
      responses:
        "200":
          description: SVG badge
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Get public status page component badge
      tags:
      - public-status
  /status/{slug}/incidents:
    get:
      consumes:
      - application/json
      description: Get published public incidents for a status page
      operationId: listPublicStatusPageIncidents
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    incidents:
                      items:
                        $ref: '#/definitions/internal_api.StatusPagePublicIncidentResponse'
                      type: array
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: List public status page incidents
      tags:
      - public-status
  /status/{slug}/incidents/{incident_id}:
    get:
      consumes:
      - application/json
      description: Get a published public incident for a status page
      operationId: getPublicStatusPageIncident
      parameters:
      - description: Status page slug
        in: path
        name: slug
        required: true
        type: string
      - description: Public incident ID
        in: path
        name: incident_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    incident:
                      $ref: '#/definitions/internal_api.StatusPagePublicIncidentResponse'
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: Get public status page incident
      tags:
      - public-status
  /v1/agents:
    get:
      consumes:
      - application/json
      description: Get a paginated list of all registered agents
      operationId: getAgents
      parameters:
      - default: 50
        description: Maximum number of agents to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of agents to skip
        in: query
        name: offset
        type: integer
      - description: Search by server or monitor name
        in: query
        name: search
        type: string
      - description: Filter by computed server status
        in: query
        name: status
        type: string
      - description: Filter by maintenance mode true or false
        in: query
        name: maintenance
        type: string
      - description: Only return stale servers
        in: query
        name: stale_only
        type: boolean
      - description: Only return servers with active incidents
        in: query
        name: has_incidents
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  properties:
                    agents:
                      items:
                        $ref: '#/definitions/internal_api.AgentResponse'
                      type: array
                    count:
                      format: int64
                      type: integer
                    limit:
                      type: integer
                    offset:
                      type: integer
                    pagination:
                      $ref: '#/definitions/orion_core_internal_utils.PaginationMeta'
                  type: object
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      summary: List agents
      tags:
      - agents
  /v1/agents/{agent_id}/{monitor_id}/report:
    post:
      consumes:
      - application/json
      description: Receive and store a monitor report for a specific monitor
      operationId: receiveMonitorReport
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Monitor ID
        in: path
        name: monitor_id
        required: true
        type: string
      - description: Monitor report data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/orion_core_internal_service.MonitorReportPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Receive monitor report
      tags:
      - reports
  /v1/agents/{agent_id}/logs/batch:
    post:
      consumes:
      - application/json
      description: Receive and deduplicate a bounded batch of structured Orion Agent
        service logs
      operationId: receiveAgentLogBatch
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Service log batch
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/orion_core_internal_service.ServiceLogBatchPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/orion_core_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_api.ServiceLogBatchResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Receive agent service logs
      tags:
      - service-logs
  /v1/agents/{agent_id}/maintenance:
    put:
      consumes:
      - application/json
      description: Enable or disable maintenance mode for a specific agent
      operationId: setMaintenanceMode
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Maintenance mode request
        in: body
