        in: query
        name: cursor
        type: string
      - default: 0
        description: 'Deprecated: number of events to skip'
        in: query
        name: offset
        type: integer
      - description: Filter by event source
        in: query
        name: source
        type: string
      - description: Filter by event type
        in: query
        name: type
        type: string
