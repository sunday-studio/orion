        in: query
        name: severity
        type: string
      - description: Text search over title, INC number, monitor and server name
        in: query
        name: q
        type: string
      - description: 'Only incidents opened since: 24h, 7d, 30d style duration or
          an RFC3339 time'
        in: query
        name: opened_since
        type: string
      - description: Only incidents opened before this RFC3339 time
        in: query
        name: opened_until
        type: string
      - default: 50
        description: Maximum number of incidents to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of incidents to skip
        in: query
        name: offset
        type: integer
