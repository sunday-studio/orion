          $ref: '#/definitions/orion_core_internal_service.NodeDiscoveryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/orion_core_internal_utils.APIResponse'
      security:
      - BearerAuth: []
      summary: 'Node: report what was found on the host'
      tags:
      - nodes
  /v1/nodes/{node_id}/discovery/accept:
    post:
      consumes:
      - application/json
      description: 'Creates a monitor definition (Managed in Console) for each selected
        service, container, pm2 app, port or disk from the node''s latest scan, with
        interval_seconds and fail_after from the request (defaults 30 s and fail after
        2, applied to every monitor created). Storage rows are queued as one track_storage
        request. Log files are skipped: they need a log key. Core does not run anything;
        the node fetches the definitions at its next sync and reports under the same
        names.'
      operationId: acceptDiscoveredItems
      parameters:
      - description: Node ID
        in: path
        name: node_id
        required: true
        type: string
      - description: Suggestions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.AcceptDiscoveredRequest'
