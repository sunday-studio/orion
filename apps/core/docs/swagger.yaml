securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
  IngestKey:
    description: Type "Bearer" followed by a space and an app ingest key (orion_ik_...).
