name: Node Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-node:
    name: Build Node ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-14
          - goos: darwin
            goarch: arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum

      - name: Build
        run: |
          mkdir -p dist
          make node-build \
            VERSION="${{ inputs.version }}" \
            GOOS="${{ matrix.goos }}" \
            GOARCH="${{ matrix.goarch }}" \
            NODE_OUTPUT="../../dist/orion-node-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/orion-node-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  publish-node:
    name: Publish Node release assets
    runs-on: ubuntu-latest
    needs: build-node
    permissions:
      actions: read
      contents: write
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installer assets
        run: |
          cp deploy/scripts/node-bootstrap.sh dist/orion-node-installer.sh
          cp deploy/scripts/node-install.sh dist/orion-node-install.sh
          cp deploy/scripts/node-uninstall.sh dist/orion-node-uninstall.sh
          cp deploy/systemd/orion-node.service dist/orion-node-systemd.service
          cp deploy/launchd/com.orion.node.plist dist/com.orion.node.plist
          cp deploy/examples/home-server-config.yaml dist/orion-node-config.yaml
          chmod 0755 dist/orion-node-installer.sh dist/orion-node-install.sh dist/orion-node-uninstall.sh

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum orion-node-* com.orion.node.plist | grep -v 'SHA256SUMS' > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/orion-node-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign checksums (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes SHA256SUMS \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/orion-node-*
            dist/com.orion.node.plist
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
