name: Website deploy

# Deploys apps/website to Cloudflare Workers static assets.
#
# - Run it by hand from the Actions tab (workflow_dispatch) at any time.
# - It also deploys on every push to main that touches the website, but only when the repository
#   variable WEBSITE_DEPLOY_ENABLED is set to "true". Leave it unset to keep automatic deploys off.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# See apps/website/README.md, "Deploy to Cloudflare".

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-deploy.yml'

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || vars.WEBSITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          command: deploy
